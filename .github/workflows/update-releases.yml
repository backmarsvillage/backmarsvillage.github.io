name: Neue Releases automatisch eintragen

on:
  schedule:
    - cron: "17 6,18 * * *" # 2x täglich (UTC)
  workflow_dispatch: {} # manuell starten: Actions → diesen Workflow → "Run workflow"

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Neue Veröffentlichungen suchen
        run: node scripts/update-releases.mjs
      - name: Änderungen speichern & Website neu bauen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "Keine Änderungen."; exit 0; fi
          git config user.name "Release-Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/releases.json
          git commit -m "Neue Veröffentlichung automatisch eingetragen"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
